<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nimbus</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #07090f;
      color: #e2e8f0;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 32px;
      border-bottom: 1px solid #111827;
    }
    .logo { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.02em; }
    .logo span { color: #3b82f6; }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.78rem;
      color: #64748b;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 99px;
      padding: 5px 12px;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #334155;
      transition: background 0.3s;
    }
    .dot.ready  { background: #34d399; box-shadow: 0 0 6px #34d39988; }
    .dot.busy   { background: #fbbf24; }
    .dot.error  { background: #f87171; }

    main { padding: 28px 32px; }
    h2 { font-size: 1rem; font-weight: 600; color: #94a3b8; margin-bottom: 16px; }

    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }
    .skeleton-card { border-radius: 10px; overflow: hidden; background: #0f172a; }
    .skeleton-img {
      width: 100%; aspect-ratio: 3/4;
      background: linear-gradient(90deg, #0f172a 25%, #1e293b 50%, #0f172a 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    .skeleton-label {
      height: 12px; margin: 10px; border-radius: 4px;
      background: linear-gradient(90deg, #0f172a 25%, #1e293b 50%, #0f172a 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }
    .game-card {
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      position: relative;
      transition: transform 0.14s;
      border: 1px solid transparent;
    }
    .game-card:hover { transform: scale(1.05); border-color: #3b82f6; }
    .game-card img {
      width: 100%; aspect-ratio: 3/4;
      object-fit: cover; display: block;
      background: #0f172a;
    }
    .game-card .name {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 24px 8px 8px;
      background: linear-gradient(transparent, rgba(0,0,0,0.85));
      font-size: 0.75rem; font-weight: 500; color: #e2e8f0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .game-card .play-overlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity 0.14s;
      background: rgba(0,0,0,0.45);
    }
    .game-card:hover .play-overlay { opacity: 1; }
    .play-icon {
      width: 42px; height: 42px;
      background: #3b82f6;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .play-icon svg { width: 16px; height: 16px; fill: #fff; margin-left: 3px; }


    #player {
      display: none;
      position: fixed; inset: 0;
      background: #000;
      z-index: 100;
    }
    #player.open { display: block; cursor: none; }
    #player.show-cursor { cursor: default; }
    #player .topbar { cursor: default; }
    #player .topbar .actions { display: flex; gap: 8px; }
    body:has(#player.open) { overflow: hidden; }

    .tools { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
    .tools input[type=search] {
      background: #0f172a; border: 1px solid #1e293b; color: #e2e8f0;
      border-radius: 8px; padding: 8px 12px; font-size: 0.85rem; min-width: 220px; outline: none;
    }
    .tools input[type=search]:focus { border-color: #3b82f6; }
    .tools label { color: #94a3b8; font-size: 0.8rem; display: flex; align-items: center; gap: 6px; cursor: pointer; }

    #player canvas.ambient {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      filter: blur(40px) brightness(0.4) saturate(2);
      transform: scale(1.1);
      pointer-events: none;
    }

    #player video {
      position: absolute;
      inset: 0; width: 100%; height: 100%;
      object-fit: contain;
      z-index: 1;
    }

    #player .topbar {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 20px;
      background: linear-gradient(rgba(0,0,0,0.6), transparent);
      z-index: 10;
      opacity: 0;
      transition: opacity 0.2s;
    }
    #player:hover .topbar,
    #player.connecting .topbar { opacity: 1; }
    #player .topbar .title { font-size: 0.88rem; font-weight: 600; }
    #player .topbar button {
      background: rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.15);
      color: #e2e8f0;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      padding: 5px 14px;
      transition: background 0.15s;
    }
    #player .topbar button:hover { background: rgba(255,255,255,0.15); }

    #player .overlay {
      display: none;
      position: absolute; inset: 0;
      flex-direction: column;
      align-items: center; justify-content: center;
      gap: 18px;
      z-index: 5;
    }
    #player.connecting .overlay { display: flex; }

    .connecting-dots { display: flex; gap: 9px; }
    .connecting-dots span {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: #3b82f6;
      animation: pdot 1.2s ease-in-out infinite;
    }
    .connecting-dots span:nth-child(2) { animation-delay: 0.2s; }
    .connecting-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pdot {
      0%,80%,100% { transform: scale(0.55); opacity: 0.35; }
      40% { transform: scale(1); opacity: 1; }
    }
    .connecting-label { color: #94a3b8; font-size: 0.83rem; letter-spacing: 0.04em; }

    #player .audio-unlock {
      display: none;
      position: absolute; inset: 0;
      align-items: center; justify-content: center;
      background: rgba(0,0,0,0.6);
      z-index: 6;
      cursor: pointer;
      flex-direction: column;
      gap: 12px;
    }
    #player .audio-unlock.show { display: flex; }
    .audio-unlock .icon { font-size: 2.5rem; }
    .audio-unlock .hint { color: #94a3b8; font-size: 0.85rem; }
  </style>
</head>
<body>

  <header>
    <div class="logo">nim<span>bus</span></div>
    <div class="status-pill">
      <div class="dot" id="dot"></div>
      <span id="status-text">Connecting…</span>
    </div>
  </header>

  <main>
    <h2 id="section-label">Setting up…</h2>
    <div class="tools">
      <input type="search" id="search" placeholder="Search games…" autocomplete="off">
    </div>
    <div class="skeleton-grid" id="skeleton"></div>
    <div class="game-grid" id="game-grid" style="display:none"></div>
  </main>

  <div id="player" class="connecting">
    <canvas class="ambient" id="ambient"></canvas>
    <video id="video" autoplay playsinline muted></video>
    <div class="topbar">
      <span class="title" id="player-title"></span>
      <div class="actions">
        <button onclick="toggleCursor()">Cursor</button>
        <button onclick="closePlayer()">Exit</button>
      </div>
    </div>
    <div class="overlay">
      <div class="connecting-dots"><span></span><span></span><span></span></div>
      <div class="connecting-label" id="player-status">Starting…</div>
    </div>
    <div class="audio-unlock" id="audio-unlock" onclick="unlockAudio()">
      <div class="icon">🔇</div>
      <div class="hint">Click to enable audio</div>
    </div>
  </div>

<script>
  const S3 = 'https://ludium-public-resources.s3-eu-west-1.amazonaws.com';
  const state = { token: null, userId: null, profileId: null, ready: false };
  let pc = null, sigWs = null, dataChannel = null;

  function setStatus(label, type) {
    document.getElementById('status-text').textContent = label;
    const dot = document.getElementById('dot');
    dot.className = 'dot' + (type ? ' ' + type : '');
  }

  const skeletonEl = document.getElementById('skeleton');
  for (let i = 0; i < 18; i++) {
    skeletonEl.innerHTML += `<div class="skeleton-card"><div class="skeleton-img"></div><div class="skeleton-label"></div></div>`;
  }

  function isPlayable(g) {
    return g.type === 'ludium' && !g.blur_for_guests;
  }

  async function fetchAllGames() {
    const size = 100;
    const seen = new Set();
    let all = [];
    for (let page = 0; page < 30; page++) {
      const res = await fetch(`/api/catalog/games?locale=en-US&page=${page}&size=${size}`).then(r => r.json());
      if (res?.status !== 'OK') {
        if (page === 0) return res;
        break;
      }
      const games = res.data.games || [];
      const fresh = games.filter(g => !seen.has(g.game_id));
      if (fresh.length === 0) break;
      fresh.forEach(g => seen.add(g.game_id));
      all = all.concat(fresh.filter(isPlayable));
    }
    return { status: 'OK', data: { games: all } };
  }

  let allGames = [];

  function applyFilters() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const list = allGames.filter(g => !q || (g.title || '').toLowerCase().includes(q));
    document.getElementById('section-label').textContent = `Games (${list.length})`;
    renderGames(list);
  }

  function toggleCursor() {
    document.getElementById('player').classList.toggle('show-cursor');
  }

  async function boot() {
    setStatus('Connecting…', '');
    const [accountRes, catalogRes] = await Promise.allSettled([
      fetch('/api/accounts', { method: 'POST' }).then(r => r.json()),
      fetchAllGames(),
    ]);

    if (accountRes.status === 'rejected' || !accountRes.value?.success) {
      setStatus('Account error', 'error');
      document.getElementById('section-label').textContent = 'Failed to connect — reload to retry';
      return;
    }

    const { token, userId, profileId } = accountRes.value.data;
    Object.assign(state, { token, userId, profileId, ready: true });

    if (catalogRes.status === 'rejected' || catalogRes.value?.status !== 'OK') {
      setStatus('Catalog error', 'error');
      document.getElementById('section-label').textContent = 'Failed to load catalog';
      return;
    }

    setStatus('Ready', 'ready');
    allGames = catalogRes.value.data.games;
    document.getElementById('search').addEventListener('input', applyFilters);
    applyFilters();
  }

  function renderGames(games) {
    const grid = document.getElementById('game-grid');
    skeletonEl.style.display = 'none';
    grid.style.display = 'grid';
    grid.innerHTML = '';
    games.forEach(game => {
      const imgPath = game.thumb_vertical?.esc_150_url || game.thumb_horizontal?.esc_150_url || '';
      const title = game.title || game.game_id;
      const card = document.createElement('div');
      card.className = 'game-card';
      card.innerHTML = `
        <img src="${imgPath ? S3 + imgPath : ''}" alt="${title}" loading="lazy" onerror="this.style.background='#1e293b'">
        <div class="name">${title}</div>
        <div class="play-overlay"><div class="play-icon"><svg viewBox="0 0 10 10"><polygon points="2,1 9,5 2,9"/></svg></div></div>
      `;
      card.onclick = () => openGame(game.game_id, title);
      grid.appendChild(card);
    });
  }


  function encodeMsg(obj) {
    const json = JSON.stringify(obj);
    const body = new TextEncoder().encode(json);
    const buf = new ArrayBuffer(4 + body.byteLength);
    new DataView(buf).setUint32(0, body.byteLength, true);
    new Uint8Array(buf, 4).set(body);
    return buf;
  }


  function decodeMsg(buf) {
    try {
      const dv = new DataView(buf instanceof ArrayBuffer ? buf : buf.buffer);
      const len = dv.getUint32(0, true);
      const bytes = new Uint8Array(buf instanceof ArrayBuffer ? buf : buf.buffer, 4, len);
      return JSON.parse(new TextDecoder().decode(bytes));
    } catch { return null; }
  }

  const INPUT = 3, ACTION = 0;
  const MOUSE_MOVE = 0, MOUSE_LDOWN = 1, MOUSE_MDOWN = 2, MOUSE_RDOWN = 3;
  const MOUSE_LUP = 4, MOUSE_MUP = 5, MOUSE_RUP = 6, MOUSE_WHEEL = 7;
  const KEY_PRESSED = 0, KEY_RELEASED = 1;

  function encodeMouseInput(winId, action, x, y) {
    const buf = new ArrayBuffer(32);
    const dv = new DataView(buf);
    dv.setUint32(0, INPUT, true);
    dv.setUint32(4, ACTION, true);
    dv.setUint32(8, winId, true);
    dv.setUint32(12, 0, true);   
    dv.setUint32(16, action, true);
    dv.setUint32(20, 8, true);    
    dv.setFloat32(24, x, true);
    dv.setFloat32(28, y, true);
    return buf;
  }

  function encodeKeyInput(winId, action, keyCode) {
    const buf = new ArrayBuffer(28);
    const dv = new DataView(buf);
    dv.setUint32(0, INPUT, true);
    dv.setUint32(4, ACTION, true);
    dv.setUint32(8, winId, true);
    dv.setUint32(12, 1, true);    
    dv.setUint32(16, action, true);
    dv.setUint32(20, 4, true);   
    dv.setUint32(24, keyCode, true);
    return buf;
  }

  let focusWinId = 0;

  function requestStream(gameId, gameName) {
    return new Promise((resolve, reject) => {
      const body = JSON.stringify({ token: state.token, userId: state.userId, profileId: state.profileId, gameId, gameName });

      fetch('/api/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Accept: 'text/event-stream' },
        body,
      }).then(res => {
        if (!res.ok) return res.json().then(j => reject(new Error(j.error || 'stream failed')));
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        function pump() {
          reader.read().then(({ done, value }) => {
            if (done) { reject(new Error('stream ended without result')); return; }
            buffer += decoder.decode(value, { stream: true });
            const lines = buffer.split('\n');
            buffer = lines.pop();
            let eventType = '';
            for (const line of lines) {
              if (line.startsWith('event: ')) eventType = line.slice(7);
              else if (line.startsWith('data: ')) {
                const data = JSON.parse(line.slice(6));
                if (eventType === 'queue') {
                  const pos = data.position !== '?' ? `#${data.position} in queue` : 'In queue';
                  document.getElementById('player-status').textContent = pos;
                } else if (eventType === 'ready') {
                  resolve(data);
                  return;
                } else if (eventType === 'error') {
                  reject(new Error(data.error));
                  return;
                }
              }
            }
            pump();
          }).catch(reject);
        }
        pump();
      }).catch(reject);
    });
  }

  async function openGame(gameId, gameName) {
    if (!state.ready) return;
    closePlayer();

    const player = document.getElementById('player');
    document.getElementById('player-title').textContent = gameName || gameId;
    document.getElementById('player-status').textContent = 'Finding a server…';
    player.classList.add('open', 'connecting');

    try {
      const { server, execToken } = await requestStream(gameId, gameName);
      document.getElementById('player-status').textContent = 'Establishing connection…';
      await startWebRTC(server, execToken, state.profileId, gameName || gameId);
    } catch (e) {
      document.getElementById('player-status').textContent = `Error: ${e.message}`;
    }
  }

  function startWebRTC(server, execToken, profileId, gameName) {
    return new Promise((resolve, reject) => {
      const wsUrl = `${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/api/signal?server=${encodeURIComponent(server)}`;
      sigWs = new WebSocket(wsUrl);

      const iceServers = [
        { urls: `stun:${server}:3478` },
        { urls: `turn:${server}:3478`, username: '1830297600', credential: 'soQ5kv5gWwPwF2bZcqKZbDqds0k=' },
      ];

      pc = new RTCPeerConnection({ iceServers });

      const remoteStream = new MediaStream();
      const video = document.getElementById('video');
      video.srcObject = remoteStream;

      pc.ontrack = e => {
        remoteStream.addTrack(e.track);
        if (e.track.kind === 'video') startAmbient(video);
      };

      pc.ondatachannel = e => {
        const dc = e.channel;
        dataChannel = dc;
        dc.binaryType = 'arraybuffer';
        let dcStage = 'auth'; 

        dc.onopen = () => {
          document.getElementById('player-status').textContent = 'Authenticating…';
          dc.send(encodeMsg({ action: 'auth', method: 'classic', token: execToken }));
        };

        dc.onmessage = e => {
          const raw = e.data instanceof ArrayBuffer ? e.data : e.data.buffer;

          if (dcStage === 'playing') {
       
            if (raw.byteLength >= 12) {
              const hdr = new DataView(raw);
              const type = hdr.getUint32(0, true);
              const subtype = hdr.getUint32(4, true);
              if (type === 0 && subtype === 0) {
                focusWinId = hdr.getUint32(8, true);
              }
            }
            return;
          }

          const msg = decodeMsg(raw);
          if (!msg) return;

          if (dcStage === 'auth' && msg.ack === 'ok') {
            dcStage = 'config';
            document.getElementById('player-status').textContent = 'Configuring…';
            dc.send(encodeMsg({
              action: 'appconfigure',
              screen_size: [window.screen.width * window.devicePixelRatio, window.screen.height * window.devicePixelRatio],
              quality_mode: 3,
              audio_fmt: 4,
              video_fmt: 1,
              audio_stream_enabled: 1,
              video_stream_enabled: 1,
              fps: 60,
              session_type: 0,
              gamepads: 1,
            }));
          } else if (dcStage === 'config' && msg.ack === 'ok') {
            dcStage = 'apprun';
            document.getElementById('player-status').textContent = 'Launching game…';
            dc.send(encodeMsg({ action: 'apprun', game: gameName }));
          } else if (dcStage === 'apprun' && msg.ack === 'ok') {
            dcStage = 'playing';
            document.getElementById('player').classList.remove('connecting');
            video.muted = true;
            video.play().catch(() => {});
            document.getElementById('audio-unlock').classList.add('show');
            bindInput(video, dc);
            resolve();
          } else if (msg.action === 'exit') {
            closePlayer();
          } else if (msg.ack === 'ko' || msg.action === 'error') {
            document.getElementById('player-status').textContent = `Error at ${dcStage}: ${msg.descError || msg.desc || 'unknown'}`;
          }
        };
      };

      pc.onconnectionstatechange = () => {
        if (pc.connectionState === 'failed') {
          document.getElementById('player-status').textContent = 'Connection failed — try again';
          document.getElementById('player').classList.add('connecting');
        }
      };

      sigWs.onmessage = async e => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'offer') {
          await pc.setRemoteDescription(msg);
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);

          await new Promise(r => {
            if (pc.iceGatheringState === 'complete') return r();
            const fallback = setTimeout(r, 5000);
            pc.onicegatheringstatechange = () => {
              if (pc.iceGatheringState === 'complete') { clearTimeout(fallback); r(); }
            };
          });
          sigWs.send(JSON.stringify({ id: 'server', type: pc.localDescription.type, sdp: pc.localDescription.sdp }));
          document.getElementById('player-status').textContent = 'Establishing stream…';
        }
      };

      sigWs.onerror = () => reject(new Error('Signal WebSocket error'));
      sigWs.onclose = () => {
   
      };


      setTimeout(() => reject(new Error('Connection timeout')), 30_000);
    });
  }

  function startAmbient(video) {
    const canvas = document.getElementById('ambient');
    const ctx = canvas.getContext('2d');
    function draw() {
      if (!document.getElementById('player').classList.contains('open')) return;
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  }

  function unlockAudio() {
    const video = document.getElementById('video');
    video.muted = false;
    video.play();
    document.getElementById('audio-unlock').classList.remove('show');
  }

  let inputCleanup = null;
  function bindInput(video, dc) {
    const sendBin = (buf) => { if (dc.readyState === 'open') dc.send(buf); };

    function videoCoords(e) {
      const r = video.getBoundingClientRect();
      const vw = video.videoWidth || 1920;
      const vh = video.videoHeight || 1080;
      const scale = Math.min(r.width / vw, r.height / vh);
      const offX = (r.width - vw * scale) / 2;
      const offY = (r.height - vh * scale) / 2;
      return [(e.clientX - r.left - offX) / scale, (e.clientY - r.top - offY) / scale];
    }

    const BUTTON_DOWN = [MOUSE_LDOWN, MOUSE_MDOWN, MOUSE_RDOWN];
    const BUTTON_UP   = [MOUSE_LUP, MOUSE_MUP, MOUSE_RUP];

    const onMouseMove = (e) => {
      const [x, y] = videoCoords(e);
      sendBin(encodeMouseInput(focusWinId, MOUSE_MOVE, x, y));
    };
    const onMouseDown = (e) => {
      e.preventDefault();
      const [x, y] = videoCoords(e);
      const act = BUTTON_DOWN[e.button];
      if (act !== undefined) sendBin(encodeMouseInput(focusWinId, act, x, y));
    };
    const onMouseUp = (e) => {
      const [x, y] = videoCoords(e);
      const act = BUTTON_UP[e.button];
      if (act !== undefined) sendBin(encodeMouseInput(focusWinId, act, x, y));
    };
    const onWheel = (e) => {
      e.preventDefault();
      const val = e.deltaY > 0 ? -120 : 120;
      sendBin(encodeMouseInput(focusWinId, MOUSE_WHEEL, val, 0));
    };
    const onKeyDown = (e) => {
      if (e.key === 'Escape') return;
      e.preventDefault();
      sendBin(encodeKeyInput(focusWinId, KEY_PRESSED, e.keyCode));
    };
    const onKeyUp = (e) => {
      if (e.key === 'Escape') return;
      e.preventDefault();
      sendBin(encodeKeyInput(focusWinId, KEY_RELEASED, e.keyCode));
    };
    const onCtxMenu = (e) => e.preventDefault();

    const player = document.getElementById('player');
    player.addEventListener('mousemove', onMouseMove);
    player.addEventListener('mousedown', onMouseDown);
    player.addEventListener('mouseup', onMouseUp);
    player.addEventListener('wheel', onWheel, { passive: false });
    player.addEventListener('contextmenu', onCtxMenu);
    document.addEventListener('keydown', onKeyDown);
    document.addEventListener('keyup', onKeyUp);

    inputCleanup = () => {
      player.removeEventListener('mousemove', onMouseMove);
      player.removeEventListener('mousedown', onMouseDown);
      player.removeEventListener('mouseup', onMouseUp);
      player.removeEventListener('wheel', onWheel);
      player.removeEventListener('contextmenu', onCtxMenu);
      document.removeEventListener('keydown', onKeyDown);
      document.removeEventListener('keyup', onKeyUp);
      inputCleanup = null;
    };
  }

  function closePlayer() {
    if (inputCleanup) inputCleanup();
    if (dataChannel) { dataChannel = null; }
    if (pc) { pc.close(); pc = null; }
    if (sigWs) { sigWs.close(); sigWs = null; }
    const video = document.getElementById('video');
    video.srcObject = null;
    video.muted = true;
    document.getElementById('audio-unlock').classList.remove('show');
    document.getElementById('player').classList.remove('open', 'connecting');
  }

  document.addEventListener('keydown', e => { if (e.key === 'Escape') closePlayer(); });

  boot();
</script>
</body>
</html>
